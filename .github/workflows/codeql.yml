name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 0 * * 0"

# Cancel any in-flight analysis when a newer commit lands on the same ref so
# rapid pushes don't queue up stale runs.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
            timeout: 360
          - language: csharp
            os: windows-latest
            build-mode: autobuild
            timeout: 360
          - language: swift
            os: macos-26
            build-mode: manual
            # Clean swift runs measured 20-29 min; leave headroom so the job
            # isn't killed by the timeout near its typical worst case.
            timeout: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Swift needs a build to extract the database. Build only the app target
      # single-arch, mirroring the CI release build, instead of CodeQL's generic
      # autobuild which compiled the whole project and dominated the ~25min runs.
      - name: Build Swift
        if: matrix.language == 'swift'
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild \
            -project apps/macos/PingStats.xcodeproj \
            -scheme PingStats \
            -configuration Release \
            -derivedDataPath .build \
            -destination "generic/platform=macOS" \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          category: "/language:${{ matrix.language }}"
