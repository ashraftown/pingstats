name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/macos/PingStats.xcodeproj \
            -scheme PingStats \
            -configuration Release \
            -derivedDataPath .build \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=".build/Build/Products/Release/PingStats.app"
          test -d "${APP_PATH}"
          test -f "${APP_PATH}/Contents/Resources/AppIcon.icns" \
            || ls -la "${APP_PATH}/Contents/Resources/"

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore apps/windows/PingStats.Windows/PingStats.Windows.csproj

      - name: Build Release
        run: dotnet build apps/windows/PingStats.Windows/PingStats.Windows.csproj -c Release --no-restore

  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a8c211a7fbc91399bcbaa05d9474e6375a451063
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Sync brand assets
        run: |
          npm run prebuild -w apps/web
          if [[ -n "$(git status --porcelain apps/web/public)" ]]; then
            echo "error: sync-brand left a diff in apps/web/public — run it and commit the result"
            git diff --stat apps/web/public
            exit 1
          fi

      - name: Build
        run: npm run build -w apps/web
