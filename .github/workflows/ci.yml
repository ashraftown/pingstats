name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/macos/PingStats.xcodeproj \
            -scheme PingStats \
            -configuration Release \
            -derivedDataPath .build \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

          APP_PATH=".build/Build/Products/Release/PingStats.app"
          test -d "${APP_PATH}"
          test -f "${APP_PATH}/Contents/Resources/AppIcon.icns" \
            || ls -la "${APP_PATH}/Contents/Resources/"

          codesign --verify --deep --strict "${APP_PATH}"
          codesign -dv "${APP_PATH}" 2>&1 | grep "Signature=adhoc"

      - name: Package app
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          ditto -c -k --keepParent ".build/Build/Products/Release/PingStats.app" \
            "PingStats-${SHORT_SHA}-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PingStats-macos
          path: PingStats-*.zip
          if-no-files-found: error

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore apps/windows/PingStats.Windows/PingStats.Windows.csproj

      - name: Build Release
        run: dotnet build apps/windows/PingStats.Windows/PingStats.Windows.csproj -c Release --no-restore

      - name: Publish single-file
        run: |
          dotnet publish apps/windows/PingStats.Windows/PingStats.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishSingleFile=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o publish/PingStats
          $short = $env:GITHUB_SHA.Substring(0, 7)
          Compress-Archive -Path publish/PingStats/* -DestinationPath "PingStats-$short-windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: PingStats-windows
          path: PingStats-*.zip
          if-no-files-found: error

  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Sync brand assets
        run: |
          npm run prebuild -w apps/web
          if [[ -n "$(git status --porcelain apps/web/public)" ]]; then
            echo "error: sync-brand left a diff in apps/web/public — run it and commit the result"
            git diff --stat apps/web/public
            exit 1
          fi

      - name: Build
        run: npm run build -w apps/web
